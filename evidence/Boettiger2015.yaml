citekey: Boettiger2015
zotero_key: EK9R9WKE
# arXiv-Preprint (arXiv:1410.0846v1, 2014), Titelzusatz "with examples from the R environment"; Seitenzahlen = Preprint, nicht gedruckte Verlagsfassung
belege:
  - id: Boettiger2015.01
    seite: "2"
    zitat: "A recent study by researchers at the University of Arizona found that less than 50% of software could even be successfully built or installed [4] and similar results are seen in an ongoing effort by other researchers to replicate that study [27]."
    kernaussage: "Laut Autor fand eine Studie der University of Arizona, dass weniger als 50 % der Software überhaupt erfolgreich gebaut oder installiert werden konnte."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Problem Abhängigkeiten ('Dependency Hell'). Sekundäraussage, verweist auf [4] und [27]"
  - id: Boettiger2015.02
    seite: "2"
    zitat: "Installing or building software necessary to run the code in question assumes the ability to recreate the computational environment of the original researchers."
    kernaussage: "Das Installieren oder Bauen der zum Ausführen nötigen Software setzt voraus, dass die Rechenumgebung der ursprünglichen Forschenden nachgebildet werden kann."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Abhängigkeiten / Umgebung"
  - id: Boettiger2015.03
    seite: "2"
    zitat: "Software dependencies are not static elements, but receive regular updates that may fix bugs, add new features or deprecate old features (or even entire dependencies themselves). Any of these changes can potentially change the results generated by the code."
    kernaussage: "Softwareabhängigkeiten werden regelmäßig aktualisiert (Fehlerbehebung, neue oder entfallende Funktionen); jede dieser Änderungen kann potenziell die vom Code erzeugten Ergebnisse verändern."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), 'code rot'"
  - id: Boettiger2015.04
    seite: "2"
    zitat: "Documentation on how to install and run code associated with published research is another frequent barrier to replication."
    kernaussage: "Laut Autor ist die Dokumentation zur Installation und Ausführung von Code zu veröffentlichter Forschung eine weitere häufige Hürde für die Replikation."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Dokumentation"
  - id: Boettiger2015.05
    seite: "3"
    zitat: "Critics of the use of VMs to support reproducibility highlight that the approach is too much of a black box and thus ill suited for reproducibility [28]."
    kernaussage: "Kritiker bemängeln, der VM-Ansatz sei zu sehr eine Black Box und daher für Reproduzierbarkeit schlecht geeignet."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Abgrenzung zur VM. Sekundäraussage, verweist auf [28]"
  - id: Boettiger2015.06
    seite: "3"
    zitat: "A Docker based approach works similarly to a virtual machine image in addressing the dependency problem by providing other researchers with a binary image in which all the software has already been installed, configured and tested."
    kernaussage: "Ein Docker-basierter Ansatz löst das Abhängigkeitsproblem ähnlich wie ein VM-Image, indem ein binäres Image bereitgestellt wird, in dem die gesamte Software bereits installiert, konfiguriert und getestet ist."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Image"
  - id: Boettiger2015.07
    seite: "4"
    zitat: "A key difference between Docker images and other virtual machines is that the Docker images share the Linux kernel with the host machine."
    kernaussage: "Ein wesentlicher Unterschied zu anderen virtuellen Maschinen ist, dass Docker-Images den Linux-Kernel mit dem Host teilen."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Abgrenzung zur virtuellen Maschine"
  - id: Boettiger2015.08
    seite: "4"
    zitat: "Sharing the Linux kernel makes Docker much more lightweight and higher performing than complete virtual machines – a typical desktop computer could run no more than a few virtual machines at once but would have no trouble running 100’s of Docker containers (a container is simply the term for running instance of an image)."
    kernaussage: "Laut Autor macht das Teilen des Linux-Kernels Docker deutlich leichtgewichtiger und performanter als vollständige VMs; ein typischer Desktop-Rechner könne nur wenige VMs, aber hunderte Container gleichzeitig betreiben. Ein Container ist die laufende Instanz eines Images."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Container-Begriff, Overhead (qualitative Aussage des Autors, keine Messung)"
  - id: Boettiger2015.09
    seite: "4"
    zitat: "Dockerfiles provide a simple script (similar to a Makefile) that defines exactly how to build up the image, consistent with the DevOps approach I mentioned previously."
    kernaussage: "Ein Dockerfile ist ein einfaches Skript (ähnlich einem Makefile), das genau festlegt, wie das Image aufgebaut wird."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Dockerfile"
  - id: Boettiger2015.10
    seite: "4"
    zitat: "This is not to say that all builds of a Dockerfile are bitwise identical. In particular, builds executed later will install more recent versions of the same software, if available, unless the package managers used are explicitly configured otherwise."
    kernaussage: "Builds eines Dockerfiles sind nicht zwingend bitweise identisch; spätere Builds installieren neuere Softwareversionen, sofern verfügbar und nicht anders konfiguriert."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Einschränkung der Reproduzierbarkeit"
  - id: Boettiger2015.11
    seite: "6"
    zitat: "First, Docker facilitates modular reuse by build one container on top of another."
    kernaussage: "Docker erleichtert modulare Wiederverwendung, indem ein Container auf einem anderen aufgebaut wird."
    quelle: exzerpt
    kommentar: "Kap. 3 (L15), Vorteil Wiederverwendung (Schichtung per FROM-Direktive)"
