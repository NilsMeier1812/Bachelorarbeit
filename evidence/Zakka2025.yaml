citekey: Zakka2025
zotero_key: XEDJBDX5
belege:
- id: Zakka2025.01
  seite: '1'
  zitat: With a simple pip install playground, researchers can train policies in minutes on a single GPU.
  kernaussage: Mit MuJoCo Playground lassen sich Policies nach einfacher Installation in Minuten auf einer GPU trainieren.
  quelle: exzerpt
  kommentar: Kap. 4.1. OCR-Fassung
- id: Zakka2025.02
  seite: '1'
  zitat: Playground supports diverse robotic platforms, including quadrupeds, humanoids, dexterous hands, and robotic arms, enabling zero-shot sim-to-real transfer from both state and pixel inputs.
  kernaussage: Playground unterstützt Vierbeiner, Humanoide, Hände und Arme mit Zero-Shot-Sim-to-Real aus Zustands- und Pixeleingaben.
  quelle: exzerpt
  kommentar: Kap. 4.1
- id: Zakka2025.03
  seite: "1"
  zitat: "This is achieved through an integrated stack comprising a physics engine, batch renderer, and training environments."
  kernaussage: "Playground besteht laut den Autoren aus einem integrierten Stack aus Physik-Engine, Batch-Renderer und Trainingsumgebungen."
  quelle: exzerpt
  kommentar: "Kap. 3.2.3 (L10) – OCR-Fassung, Abstract"
- id: Zakka2025.04
  seite: "2"
  zitat: "GPU-based simulation can significantly accelerate this process for two key reasons. First, the median GPU is far more powerful than the median CPU [65], and while high core-count CPUs exist, they are uncommon."
  kernaussage: "Laut den Autoren kann GPU-basierte Simulation das RL-Training aus zwei Gründen deutlich beschleunigen; der erste: die mittlere GPU ist wesentlich leistungsfähiger als die mittlere CPU."
  quelle: exzerpt
  kommentar: "Kap. 3.2.3 (L10) – OCR-Fassung, Zweispaltensatz teils verschachtelt; zweiter Grund steht im Folgetext (nicht exzerpiert)"
- id: Zakka2025.05
  seite: "2"
  zitat: "Locomotion and manipulation tasks which previously required days of training on multi-host setups [4, 59], can now be solved within minutes or hours on a single GPU [19, 50]."
  kernaussage: "Locomotion- und Manipulationsaufgaben, die früher Tage auf Multi-Host-Systemen brauchten, lassen sich laut den Autoren nun in Minuten bis Stunden auf einer einzelnen GPU lösen."
  quelle: exzerpt
  kommentar: "Kap. 3.2.3 (L10) – OCR-Fassung; Sekundäraussage, verweist auf [4, 59], [19, 50]"
- id: Zakka2025.06
  seite: "7"
  zitat: "MuJoCo Playground inherits the limitations of MJX due to constraints imposed by JAX."
  kernaussage: "MuJoCo Playground erbt laut den Autoren die durch JAX bedingten Einschränkungen von MJX."
  quelle: exzerpt
  kommentar: "Kap. 3.2.3 (L10) – OCR-Fassung; Einzelne Einschränkungen (JIT-Kompilierzeit 1–3 min, Kontaktberechnung skaliert mit möglichen statt aktiven Kontakten) folgen im Text, wegen OCR-Spaltenmischung nicht wörtlich exzerpiert"
