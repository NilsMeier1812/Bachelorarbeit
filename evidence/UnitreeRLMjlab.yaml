citekey: UnitreeRLMjlab
zotero_key: A3Q24Z2R
belege:
- id: UnitreeRLMjlab.01
  seite: '1'
  zitat: Unitree RL Mjlab is a reinforcement learning project built upon the mjlab, using MuJoCo as its physics simulation backend, currently supporting Unitree Go2, A2, As2, G1, R1, H1_2 and H2.
  kernaussage: Unitree RL Mjlab ist ein RL-Projekt auf Basis von mjlab mit MuJoCo als Physik-Backend, u. a. für den G1.
  quelle: exzerpt
  kommentar: Kap. 4.1 Policy-Tabelle. README, Commit 1425b15
- id: UnitreeRLMjlab.02
  seite: '1'
  zitat: 'Train: The agent interacts with the MuJoCo simulation and optimizes policies through reward maximization.'
  kernaussage: 'Training: Der Agent optimiert Policies in der MuJoCo-Simulation durch Belohnungsmaximierung.'
  quelle: exzerpt
  kommentar: Kap. 4.1
- id: UnitreeRLMjlab.03
  seite: '1'
  zitat: 'Sim2Real: Deploy trained policies to physical Unitree robots for real-world execution.'
  kernaussage: 'Sim2Real: Trainierte Policies werden auf reale Unitree-Roboter übertragen.'
  quelle: exzerpt
  kommentar: Kap. 4.1
- id: UnitreeRLMjlab.04
  seite: '3'
  zitat: During training, policy.onnx and policy.onnx.data are also exported for deployment onto physical robots.
  kernaussage: Beim Training wird die Policy als ONNX für den Einsatz auf realen Robotern exportiert.
  quelle: exzerpt
  kommentar: Kap. 4.1 Tabelle (Format)
