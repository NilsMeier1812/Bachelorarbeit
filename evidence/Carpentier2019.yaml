citekey: Carpentier2019
zotero_key: PX2SE4EX
belege:
- id: Carpentier2019.01
  seite: '2'
  zitat: We introduce Pinocchio, an open-source software framework that implements rigid body dynamics algorithms and their analytical derivatives.
  kernaussage: Pinocchio ist ein Open-Source-Framework mit Algorithmen der Starrkörperdynamik und ihren analytischen Ableitungen.
  quelle: exzerpt
  kommentar: Kap. 4.2.1/7.4 Werkzeug. HAL-Fassung
- id: Carpentier2019.02
  seite: '2'
  zitat: Pinocchio does not only include standard algorithms employed in robotics (e.g., forward and inverse dynamics) but provides additional features essential for the control, the planning and the simulation of robots.
  kernaussage: Pinocchio bietet neben Standardalgorithmen (Vorwärts-/Inversdynamik) Funktionen für Regelung, Planung und Simulation.
  quelle: exzerpt
  kommentar: Kap. 4.2.1/7.4
- id: Carpentier2019.03
  seite: "3"
  zitat: "Aside the kinematic model, Pinocchio defines a geometric model, i.e. the volumes attached to the kinematic tree. This model can be used for displaying the robot and computing quantities associated to collisions."
  kernaussage: "Pinocchio hat neben dem kinematischen ein geometrisches Modell, das u. a. für Kollisionsgrößen dient."
  quelle: exzerpt
  kommentar: "Kap. Umsetzung (27.11.2026)"
- id: Carpentier2019.04
  seite: "3"
  zitat: "Collision and distance algorithms for the kinematic trees are implemented, based on FCL methods."
  kernaussage: "Pinocchio implementiert Kollisions- und Abstandsalgorithmen für kinematische Bäume auf Basis von FCL."
  quelle: exzerpt
  kommentar: "Kap. Umsetzung (27.11.2026)"
