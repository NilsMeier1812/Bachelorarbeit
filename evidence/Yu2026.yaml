citekey: Yu2026
zotero_key: MCFF9VCG
# Beitrag im Sammelband "Machine Intelligence and Digital Applications" (IOS Press, ATDE), S. 1625–1635, CC BY-NC 4.0.
# Reine MATLAB/Simulink-Studie ohne Versuch am realen G1. Achtung, innere Widersprüche in der Quelle:
# Batterie 1008 Wh vs. Verbrauch 3,10 Wh, aber "Battery Utilization Rate" 72,3 % (S. 1631/1633);
# G1-Kennwerte (Arm 338 mm, Oberschenkel 0,45 m, Akku 67,2 V/15 Ah) sind nicht weiter belegt.
# -> Für G1-Kennwerte besser das Herstellerdatenblatt zitieren; Yu2026 eher als Beispiel verwandter Arbeit.
belege:
  - id: Yu2026.01
    seite: "1625"
    zitat: "The Unitree G1 humanoid robot (developed by Hangzhou Yushu Technology) is increasingly applied in entertainment scenarios such as stage dance performance"
    kernaussage: "Der Unitree G1 (Hangzhou Yushu Technology) wird zunehmend in Unterhaltungsszenarien wie Bühnentanz eingesetzt."
    quelle: exzerpt
    kommentar: "Kap. 2.1.2 Einsatzszenarien; Kap. 2.2 (Hersteller)"
  - id: Yu2026.02
    seite: "1625"
    zitat: "powered by a 67.2 V/15 Ah battery"
    kommentar: "Kap. 2.2 Hardware. Nur Angabe der Autoren ohne Beleg – mit Unitree-Datenblatt abgleichen, falls vorhanden."
    kernaussage: "Der G1 wird laut den Autoren von einer Batterie mit 67,2 V/15 Ah versorgt."
    quelle: exzerpt
  - id: Yu2026.03
    seite: "1631"
    zitat: "Simulations were conducted using MATLAB/Simulink with a custom-built Unitree G1 robot model, incorporating the robot’s actual structural parameters (arm length 338mm, thigh length 0.45m, shin length 0.40m) and motor specifications (shoulder joint range ±120°, rated angular velocity 20°/s)."
    kernaussage: "Die Studie simuliert in MATLAB/Simulink mit einem selbst erstellten G1-Modell (Armlänge 338 mm, Oberschenkel 0,45 m, Unterschenkel 0,40 m, Schultergelenk ±120°, Nenn-Winkelgeschwindigkeit 20°/s)."
    quelle: exzerpt
    kommentar: "Kap. 4.4 Verwandte Arbeiten (anderes Werkzeug als MuJoCo); Kap. 3.2.2 Vergleich Simulatoren"
  - id: Yu2026.04
    seite: "1634"
    zitat: "The research is based on MATLAB/Simulink simulation, and physical experiments on the actual Unitree G1 robot are required to verify the simulation results."
    kernaussage: "Die Autoren nennen als Limitation, dass ihre Ergebnisse nur auf Simulation beruhen und Versuche am realen G1 zur Verifikation nötig sind."
    quelle: exzerpt
    kommentar: "Kap. 5.1 Handlungsbedarf (Sim-Ergebnisse ohne Realabgleich); Kap. 4.4"
  - id: Yu2026.05
    seite: "1634"
    zitat: "The model adopts ideal assumptions, ignoring ground reaction forces, which is a common limitation in dance-specific motion planning [15,16]"
    kernaussage: "Das Modell der Studie vernachlässigt Bodenreaktionskräfte; laut Autoren eine häufige Einschränkung in der Bewegungsplanung für Tanz."
    quelle: exzerpt
    kommentar: "Kap. 3.1.2 Sim-to-Real-Lücke (vereinfachte Modelle); Teil 2 ist Sekundäraussage mit Verweis auf [15,16]"
  - id: Yu2026.06
    seite: "1629"
    zitat: "To maintain dynamic balance during dance movements, a Proportional-Derivative (PD) control strategy adjusts the leg joints dynamically, compensating for the CoG shift caused by upper-body motion"
    kernaussage: "Zum Gleichgewichthalten passt eine PD-Regelung die Beingelenke an und gleicht die Schwerpunktverschiebung durch Oberkörperbewegungen aus."
    quelle: exzerpt
    kommentar: "Kap. 4.1.1 Modellbasierte Gleichgewichtsregelung; vgl. Stand-PD mit Schwerpunktführung in Kap. 7.3.1"
  - id: Yu2026.07
    seite: "1626"
    zitat: "for balance control, PD-based methods are common but struggle with upper-body disturbance compensation [4]."
    kernaussage: "PD-basierte Gleichgewichtsregelungen sind verbreitet, haben aber Schwierigkeiten, Störungen durch den Oberkörper auszugleichen."
    quelle: exzerpt
    kommentar: "Kap. 4.1.1. Sekundäraussage mit Verweis auf [4] (Bulbul et al. 2024) – besser Originalquelle beschaffen."
  - id: Yu2026.08
    seite: "1628"
    zitat: "The coefficients ai are determined by boundary conditions ensuring zero velocity and acceleration at the start and end of each step, which guarantees C2 continuity and eliminates abrupt changes in acceleration (jerk)."
    kernaussage: "Bei der Planung mit Polynom fünften Grades legen Randbedingungen (Geschwindigkeit und Beschleunigung null an Anfang und Ende) die Koeffizienten fest; das sichert C2-Stetigkeit und vermeidet Beschleunigungssprünge."
    quelle: exzerpt
    kommentar: "Kap. 4.2.2 Bahnplanung (Trajektorienglättung)"
  - id: Yu2026.09
    seite: "1632"
    zitat: "The results indicate a 15.5% overall reduction in total energy consumption (from 3.10 Wh to 2.62 Wh)"
    kernaussage: "In der Simulation sank der Gesamtenergieverbrauch durch die Trajektorienoptimierung um 15,5 % (von 3,10 Wh auf 2,62 Wh)."
    quelle: exzerpt
    kommentar: "Kap. 4.4 Verwandte Arbeiten (nur Sim-Ergebnis)"
  - id: Yu2026.10
    seite: "1634"
    zitat: "The electromechanical efficiency factor is set as a fixed value (0.85), while the actual motor efficiency changes with the operating point (torque/velocity)"
    kernaussage: "Die Studie nutzt einen festen Wirkungsgrad von 0,85, obwohl der tatsächliche Motorwirkungsgrad vom Betriebspunkt (Moment/Drehzahl) abhängt."
    quelle: exzerpt
    kommentar: "Kap. 3.1.2 / 8.5.3 Beispiel für Modellvereinfachung in der Simulation"
  - id: Yu2026.11
    seite: "1635"
    zitat: "Conduct physical experiments on the actual Unitree G1 robot, and implement real-time adaptive control based on sensor feedback to adapt to uncertain environmental conditions (e.g., different stage floor frictions)."
    kernaussage: "Als künftige Arbeit nennen die Autoren Versuche am realen G1 und eine sensorbasierte adaptive Echtzeitregelung für unsichere Umgebungsbedingungen (z. B. unterschiedliche Bodenreibung)."
    quelle: exzerpt
    kommentar: "Kap. 5.1 Handlungsbedarf"
