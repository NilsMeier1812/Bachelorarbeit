belege:
- id: Ze2025.01
  seite: '1'
  zitat: Yet, most current humanoid teleoperation systems fall short of enabling coordinated whole-body behavior, typically limiting themselves to isolated locomotion or manipulation tasks.
  kernaussage: Die meisten Humanoid-Teleoperationssysteme beschränken sich auf Fortbewegung oder Manipulation statt koordinierter Ganzkörperbewegung.
  quelle: exzerpt
  kommentar: Kap. 4.3.1
- id: Ze2025.02
  seite: '3'
  zitat: the Unitree G1—a medium-sized humanoid robot with 29 degrees of freedom (DoF)—to perform a wide range of diverse, human-like skills.
  kernaussage: Die Autoren beschreiben den Unitree G1 als mittelgroßen Humanoiden mit 29 Freiheitsgraden.
  quelle: exzerpt
  kommentar: Kap. 2.2 (Hardware, 29-DoF-Variante in der Forschung)
- id: Ze2025.03
  seite: '7'
  zitat: We showcase the teleoperation capabilities of TWIST on Unitree G1, a 29 DoF 1.3m humanoid robot.
  kernaussage: Der in der Arbeit genutzte G1 ist ein 1,3 m großer Humanoide mit 29 Freiheitsgraden.
  quelle: exzerpt
  kommentar: Kap. 2.2
