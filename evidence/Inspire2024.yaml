  zitat: These dexterous hands feature six Micro linear servo actuators equipped with sensitive pressure sensors. By setting different force control thresholds, precise gripping force control can be achieved.
  kernaussage: Die RH56DFTP hat sechs Mikro-Linearservoaktoren mit Drucksensoren; über Kraftschwellen lässt sich die Greifkraft regeln.
  quelle: exzerpt
  kommentar: Kap. 4.2.4 / 2.2. Herstellerhandbuch V1.0.0
- id: Inspire2024.02
  seite: '4'
  zitat: High-precision tactile sensors are integrated into the fingertips, finger pads, and palm areas, providing real-time feedback on finger gripping information.
  kernaussage: Taktilsensoren in Fingerspitzen, Fingerballen und Handfläche melden Greifinformationen in Echtzeit.
  quelle: exzerpt
  kommentar: Kap. 4.2.4
- id: Inspire2024.03
