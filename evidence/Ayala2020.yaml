citekey: Ayala2020
zotero_key: 92835K6P
# ICDL-EpiRob 2020, arXiv-Preprint v1 vom 11.08.2020 (nicht Verlagsfassung; Seitenzahlen = Preprint-Seiten 1-10). Vergleich von Gazebo, Webots und V-REP mit einem NAO-Roboter in einem Navigationsszenario auf einer virtuellen Maschine; keine Messdaten eines realen Roboters, keine Laufregelung, kein MuJoCo.
belege:
  - id: Ayala2020.01
    seite: "1"
    zitat: "This paper presents a quantitative comparison of Gazebo, Webots, and V-REP, three simulators widely used by the research community to develop robotic systems. To compare the performance of these three simulators, elements such as CPU, memory footprint, and disk access are used to measure and compare them to each other."
    kernaussage: "Laut Autoren vergleicht die Arbeit Gazebo, Webots und V-REP quantitativ anhand von CPU-Last, Speicherbedarf und Festplattenzugriffen."
    quelle: exzerpt
    kommentar: "Kap. 3.2.3 (L10/L11): verglichene Simulatoren und Kennzahlen"
  - id: Ayala2020.02
    seite: "1"
    zitat: "In order to measure the use of resources, each simulator executes 20 times a robotic scenario composed by a NAO robot that must navigate to a goal position avoiding a specific obstacle. In general terms, our results show that Webots is the simulator with the lowest use of resources, followed by V-REP, which has advantages over Gazebo, mainly because of the CPU use."
    kernaussage: "Laut Autoren führt jeder Simulator das Szenario (NAO navigiert zu einem Ziel und weicht einem Hindernis aus) 20-mal aus; Webots verbraucht die wenigsten Ressourcen, gefolgt von V-REP, das vor allem bei der CPU-Last Vorteile gegenüber Gazebo hat."
    quelle: exzerpt
    kommentar: "Kap. 3.2.3 (L11): Ergebnis; nur NAO, ein Szenario, keine realen Daten"
  - id: Ayala2020.03
    seite: "2"
    zitat: "In this classification, a physics engine is considered the software responsible for representing rigid-body structures, as well as the dynamics of movement and contact between different structures. A simulation system is a complete suite containing physics engines, which can incorporate a model editor, sensor simulation, and the possibility of interaction with the user."
    kernaussage: "Laut Autoren ist eine Physik-Engine die Software für Starrkörperstrukturen sowie Bewegungs- und Kontaktdynamik, ein Simulationssystem dagegen eine vollständige Suite mit Physik-Engine, die Modelleditor, Sensorsimulation und Nutzerinteraktion enthalten kann."
    quelle: exzerpt
    kommentar: "Kap. 3.2.1/3.2.3 (L10): Begriffe Physik-Engine und Simulationssystem (Fig. 1, S. 2: Klassifikation nach [6], als Vorlage für eine eigene Darstellung denkbar)"
  - id: Ayala2020.04
    seite: "6"
    zitat: "The comparison was carried out using a virtual machine configured in VirtualBox v5.2 comprising an Intel® Core™ i5-2410M @2.30GHz, 6GB of memory, and 320GB Hitachi SATA II @7200 RPM hard disk drive."
    kernaussage: "Laut Autoren erfolgte der Vergleich in einer virtuellen Maschine (VirtualBox v5.2) mit einem Intel Core i5-2410M mit 2,30 GHz, 6 GB Arbeitsspeicher und einer 320-GB-Festplatte mit 7200 U/min."
    quelle: exzerpt
    kommentar: "Kap. 3.2.3 (L11): Einschränkung, Messbedingungen (virtuelle Maschine, ältere Hardware)"
  - id: Ayala2020.05
    seite: "6"
    zitat: "The Webots simulator required the lowest amount of processing power, using in average 11.05% of the processor to execute the simulation tasks. Following, V-REP used almost twice of CPU, with an average of 20.65%. For Gazebo, the use of CPU was the highest, presenting an average of 42.38%, for the execution of a simple simulation task."
    kernaussage: "Laut Autoren benötigte Webots im Mittel 11,05 % des Prozessors, V-REP fast doppelt so viel (Mittel 20,65 %) und Gazebo am meisten (Mittel 42,38 %) für eine einfache Simulationsaufgabe."
    quelle: exzerpt
    kommentar: "Kap. 3.2.3 (L11): CPU-Kennzahlen, Fig. 3 (S. 6); 20 Läufe, ein NAO-Szenario"
  - id: Ayala2020.06
    seite: "8"
    zitat: "Additionally, they all include the ODE engine for the simulation of physics in the virtual environment."
    kernaussage: "Laut Autoren enthalten alle drei verglichenen Simulatoren die Physik-Engine ODE für die Simulation der Physik."
    quelle: exzerpt
    kommentar: "Kap. 3.2.3 (L10/L11): Einschränkung, gleiche Physik-Engine, daher kein Vergleich der Engines"
  - id: Ayala2020.07
    seite: "8"
    zitat: "Additionally, a more comprehensive comparison should take into account different kind of scenarios, from simple tasks to more complex ones using tools as direct planning, direct and inverse kinematics, collision avoidance, and image processing among others, as well as other kinds of robot platforms."
    kernaussage: "Laut Autoren sollte ein umfassenderer Vergleich unterschiedliche Szenarien von einfachen bis komplexen Aufgaben (u. a. Planung, Kinematik, Kollisionsvermeidung, Bildverarbeitung) sowie andere Roboterplattformen berücksichtigen."
    quelle: exzerpt
    kommentar: "Kap. 3.2.3 (L11): von den Autoren genannte Einschränkung der eigenen Studie"
